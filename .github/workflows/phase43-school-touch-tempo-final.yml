name: Phase43 school Firebase friends touch tempo final delivery
on:
  push:
    branches:
      - feat/phase1-action-circle-lab-20261023
    paths:
      - '.github/workflows/phase43-school-touch-tempo-final.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-playability-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned esbuild
        run: npm install --no-save --package-lock=false --ignore-scripts esbuild@0.25.12
      - name: Battle regression tests
        run: node --test tests/*.test.mjs
      - name: Simulate full rental match finish for four seeds
        run: node tools/normal-match-endurance.mjs
      - name: Verify real Chromium touch + central mode + action display
        run: node tools/stage-smoke.mjs
      - name: Compile no-Auth direct-code Firebase Friends
        run: node tools/build-sites-online.mjs --friends
      - name: Check Phase43 school patch is really shipped and safe
        run: |
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import {readFileSync,statSync} from 'node:fs';
          import {PLAYTEST_SOUL_TUNING as P} from './engine/playtest-soul-tuning.mjs';
          import {SCHOOL_RENTAL_PERSONALITIES as S} from './engine/combat.mjs';
          assert.equal(P.attackGain,18);
          assert.equal(P.techniqueGain,18);
          assert.equal(P.pokeHeavyWeight,.1);
          assert.deepEqual(S.map(x=>x.attitude),
            ['grouchy','gentle','careful','brainy','gentle','cruel']);
          const html=readFileSync('dist/sites-online-friends-code.html','utf8');
          assert.ok(statSync('dist/sites-online-friends-code.html').size>180000);
          for(const x of ['mygame-df915-default-rtdb.firebaseio.com','yokaiRoomsV1',
            'mb-action-callout','touchstart','touchmove','mb-center-symbol',
            'yw-online-make','yw-online-join','yw-online-start',
            'firebase-app-compat.js','firebase-database-compat.js'])
            assert.ok(html.includes(x),'bundle missing '+x);
          assert.doesNotMatch(html,/firebase-auth-compat\.js|signInAnonymously\(/);
          assert.doesNotMatch(html,/supabase\.co|sb_secret_|service_role|127\.0\.0\.1:9099/);
          assert.equal((html.match(/<style\b/g)||[]).length,1);
          console.log('PHASE43-SCHOOL-FRIENDS-BUNDLE-PASS '+statSync('dist/sites-online-friends-code.html').size);
          EOF
      - name: Publish unique verified release branch with separate TXT and HTML
        run: |
          git switch -c release/sites-firebase-friends-20261027-v3-touch-tempo
          mkdir -p delivery
          cp dist/sites-online-friends-code.html delivery/YW2_Firebase_Friends_20261027_V3_TOUCH_TEMPO_Sites_PASTE.txt
          cp dist/sites-online-friends-code.html delivery/YW2_Firebase_Friends_20261027_V3_TOUCH_TEMPO_Sites_PASTE.html
          cmp delivery/YW2_Firebase_Friends_20261027_V3_TOUCH_TEMPO_Sites_PASTE.txt delivery/YW2_Firebase_Friends_20261027_V3_TOUCH_TEMPO_Sites_PASTE.html
          git add -f delivery/YW2_Firebase_Friends_20261027_V3_TOUCH_TEMPO_Sites_PASTE.txt delivery/YW2_Firebase_Friends_20261027_V3_TOUCH_TEMPO_Sites_PASTE.html
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'release: Phase43 20261027 school feedback improvements V3 [skip ci]'
          git push origin HEAD:refs/heads/release/sites-firebase-friends-20261027-v3-touch-tempo
          echo 'PHASE43-VERIFIED-RELEASE-BRANCH-READY'
      - uses: actions/upload-artifact@v4
        with:
          name: phase43-20261027-V3-school-touch-tempo
          path: |
            delivery/YW2_Firebase_Friends_20261027_V3_TOUCH_TEMPO_Sites_PASTE.txt
            delivery/YW2_Firebase_Friends_20261027_V3_TOUCH_TEMPO_Sites_PASTE.html
          if-no-files-found: error
          retention-days: 14
