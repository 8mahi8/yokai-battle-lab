name: Phase14 original-engine stage QA
on:
  push:
    branches:
      - feat/phase1-action-circle-lab-20261023
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Check browser-stage modules
        run: |
          node --version
          node --check engine/match-protocol.mjs
          node --check ui/character-art.mjs
          node --check ui/match-stage.mjs
          node --check tools/stage-smoke.mjs
      - name: Verify original match renderer state
        run: node --test tests/match-stage.test.mjs tests/character-art.test.mjs
      - name: Install CJK font for truthful Japanese screenshot QA
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Render and interact in real Chromium
        run: node tools/stage-smoke.mjs
      - name: Verify actual PointerEvents across 10 touch trials
        run: node tools/gesture-stage-smoke.mjs
      - name: Preserve actual stage screenshot for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase14-original-engine-stage-preview
          path: |
            phase14-stage-preview.png
            phase15-character-gallery.png
            phase16-ipad-landscape-preview.png
            phase16-target-selection-preview.png
          if-no-files-found: ignore
