name: Firebase room emulator research
# Archived authentication-era Firebase QA; retained for manual research.
# The current school game uses no-Auth Firebase Friends (Phase37 workflow).
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firebase-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install local emulator tooling only
        run: npm install --no-save --package-lock=false firebase-tools@14.24.0 @firebase/rules-unit-testing@4.0.1
      - name: Validate isolated database permissions
        run: ./node_modules/.bin/firebase emulators:exec --only database --project demo-yokai-lab --config network/emulator/firebase.json "node tests/firebase-room-emulator.cjs"
