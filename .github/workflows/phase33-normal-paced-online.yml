name: Phase33 real Supabase long normal-speed 6v6 match
# Archived Supabase-only QA from the pre-Firebase school design.
# Historical workflows remain for audit; NEVER run on current dev pushes.
# Active friends online QA uses .github/workflows/phase37-firebase-friends.yml.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  normal-paced-duel:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build UNMODIFIED six-rental owner HTML
        run: |
          npm install --no-save --package-lock=false --ignore-scripts esbuild@0.25.12
          node --check tools/supabase-sites-normal-paced-smoke.mjs
          node tools/build-sites-supabase.mjs --public-config
          if grep -q 'QA-ONLY-NEVER-DEPLOY\|yw-online-qa-finish' dist/sites-supabase-online-code.html; then
            echo 'FATAL: QA-only accelerated fixture entered normal HTML'
            exit 1
          fi
      - name: Run normal 1.5 second paced 6v6 duel for sixty actions, confirm remote ACK and final sync
        run: node tools/supabase-sites-normal-paced-smoke.mjs
