<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>輪戦ラボ Phase 2</title>
<style>:root{color-scheme:dark;font:14px system-ui;background:#101725;color:#e9f3ff}*{box-sizing:border-box}body{margin:0;padding:12px;background:radial-gradient(ellipse at top,#283c54,#101725 75%)}main{max-width:1100px;margin:auto}h1{font-size:22px;margin:5px 0}.notice{font-size:12px;color:#eacba0;line-height:1.5}.layout{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:10px}.board,.panel{padding:12px;background:#1b2c40;border:1px solid #435b72;border-radius:12px}.team+.team{margin-top:12px;padding-top:12px;border-top:1px solid #435b72}.heading{font-weight:800;display:flex;justify-content:space-between}.heading small{color:#acbdce;font-weight:400}.front{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:8px 0}.unit{padding:8px;background:#253c50;border:1px solid #53738b;border-radius:9px;min-width:0}.unit.dead{opacity:.45}.unit.pinned{border:2px solid #eed68c}.unit.recent{box-shadow:0 0 0 2px #a5e5c5}.unit b{display:block;margin-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hpbar{height:6px;background:#142131;border-radius:5px;overflow:hidden;margin:6px 0}.hpbar i{display:block;height:100%;background:#89dba4}.info,.bench{color:#bfd0df;font-size:11px}.bench{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.bench span{padding:5px;background:#122133;border-radius:6px}button{font:600 12px system-ui;background:#34526e;color:#fff;border:1px solid #6f90a9;border-radius:8px;padding:7px 9px;cursor:pointer;touch-action:manipulation;min-height:31px;margin:2px}button:focus-visible{outline:2px solid #fff}.unit button{font-size:10px;width:100%;margin:4px 0 0;padding:3px}button:disabled{opacity:.5}.controls{display:flex;flex-wrap:wrap}#log{height:245px;overflow:auto;background:#0d1c2d;border:1px solid #3a536c;border-radius:7px;padding:6px;font-size:11px}#log div{padding:5px;border-bottom:1px solid #344960}#count{font-size:28px;font-weight:900}#status{font-size:12px;min-height:48px;color:#a7dad1;padding-top:9px}.forecast-title{font-size:12px;font-weight:800;color:#c9e4f1;margin:2px 0 6px}
.forecast{display:grid;grid-template-columns:repeat(5,minmax(94px,1fr));gap:5px;overflow-x:auto;margin-bottom:11px}
.forecast .slot{min-width:0;background:#102234;border:1px solid #49657e;border-radius:8px;padding:6px;font-size:11px}
.forecast .slot b{font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.forecast .slot small{color:#b1cada}
.forecast .bar{height:5px;background:#28374e;margin-top:5px;border-radius:5px;overflow:hidden}
.forecast .bar i{height:100%;display:block;background:#94e2c7}
@media(max-width:700px){.layout{grid-template-columns:1fr}}@media(max-height:520px) and (orientation:landscape){body{padding:6px}.board,.panel{padding:6px}.unit{padding:5px}.unit b{margin-top:2px}.team+.team{padding-top:5px;margin-top:5px}.layout{grid-template-columns:minmax(0,1fr) 230px}#log{height:150px}}</style>
</head><body><main><header><small>ORIGINAL COMBAT RESEARCH</small><h1>輪戦ラボ / Phase 2</h1></header><p class="notice">攻撃・妖術・回復・ガードと、実験用の睡眠・後衛おはらいを研究するBOT試験画面です。原作の戦闘処理を完全に再現したものではありません。キャラの数値と回復式、行動選択には仮設定があります。</p><div class="layout"><section class="board"><div class="forecast-title">次の5行動・予測（回転や状態変化で変わります）</div><div class="forecast" id="forecast"></div><div id="team0" class="team"></div><div id="team1" class="team"></div></section><aside class="panel"><div>行動数 <strong id="count">0</strong></div><div class="controls"><button id="one">1行動</button><button id="many">20行動</button><button id="reset">リセット</button></div><div id="status" aria-live="polite">準備完了</div><div id="log" aria-live="polite"></div></aside></div></main>
<script type="module">
import {createCombat} from '../engine/combat.mjs';
const el=id=>document.getElementById(id);
let battle=createCombat(),actions=[],last=null;
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function draw(){
 const snap=battle.snapshot();el('count').textContent=snap.clock.turn;
 const unitMap=new Map(snap.squads.flat().map(unit=>[unit.id,unit]));
 const clockMap=new Map(snap.clock.teams.flatMap(team=>team.members).map(unit=>[unit.id,unit]));
 const seen=new Set();
 el('forecast').innerHTML=battle.preview(5).map((entry,i)=>{
   const unit=unitMap.get(entry.id),clock=clockMap.get(entry.id),repeat=seen.has(entry.id);
   seen.add(entry.id);
   // Research-only display: a repeated actor's gauge is reset, not copied from now.
   const progress=repeat?0:Math.round(100*Math.max(0,Math.min(1,1-clock.wait/clock.cost)));
   return '<div class="slot"><small>'+(i+1)+'番目 '+entry.id+'</small><b>'+esc(unit.name)+'</b><div class="bar"><i style="width:'+progress+'%"></i></div><small>'+progress+'% '+(repeat?'再行動': '現在値')+'</small></div>';
 }).join('');
 for(let side=0;side<2;side++){
  const team=snap.squads[side],ring=snap.clock.teams[side],byId=new Map(team.map(m=>[m.id,m]));
  let html='<div class="heading">TEAM '+(side?'B':'A')+'<small>レンタル6体 / 回転位置 '+(ring.offset+1)+'</small></div><div class="front">';
  for(const id of ring.frontIds){
   const m=byId.get(id),selected=snap.pins[1-side]===id,asleep=snap.inspirits[id]?.some(x=>x.effect==='sleep');
   html+='<div class="unit '+(m.hp===0?'dead ':'')+(selected?'pinned ':'')+(last===id?'recent':'')+'"><span class="info">'+id+' '+(m.guard?'🛡️':'')+(asleep?' 💤':'')+'</span><b>'+esc(m.name)+'</b><div class="hpbar"><i style="width:'+Math.round(m.hp/m.maxHp*100)+'%"></i></div><div class="info">'+m.hp+'/'+m.maxHp+'</div><button data-pin="'+id+'" data-side="'+(1-side)+'" '+(m.hp===0?'disabled':'')+'>'+(selected?'指定解除':'対象に指定')+'</button><button data-sleep="'+id+'" '+(m.hp===0||asleep?'disabled':'')+'>睡眠を付与（実験）</button></div>';
  }
  html+='</div><div class="bench">'+ring.benchIds.map(id=>{let m=byId.get(id);const needsPurify=snap.inspirits[id]?.some(x=>x.sign==='negative');return '<span>'+id+' '+esc(m.name)+' '+m.hp+'/'+m.maxHp+(needsPurify?' 💤 <button data-purify="'+id+'" data-owner="'+side+'">おはらい</button>':'')+'</span>';}).join('')+'</div><div class="controls"><button data-rotate="'+side+'" data-dir="-1">◀ 左回転</button><button data-rotate="'+side+'" data-dir="1">右回転 ▶</button></div>';
  el('team'+side).innerHTML=html;
 }
 el('log').innerHTML=actions.slice(-35).reverse().map(x=>'<div>#'+x.turn+' '+x.actor+' '+({attack:'攻撃',technique:'妖術',heal:'回復',guard:'防御'}[x.kind]||'')+(x.target?' → '+x.target:'')+(x.amount?' '+x.amount+'HP':'')+(x.hit===false?' ミス':'')+'</div>').join('')||'<div>行動待ち</div>';
 if(snap.winner!==null)el('status').textContent='TEAM '+(snap.winner?'B':'A')+' 勝利！';
}
function next(n){const result=battle.simulate(n);for(const r of result)if(r.type==='action'){actions.push(r);last=r.actor;}el('status').textContent=result.at(-1)?.type==='awaiting_rotation'?'前衛不在・回転が必要':n+'行動実行';draw();}
document.addEventListener('click',event=>{
 const btn=event.target.closest('button');if(!btn)return;
 try{
 if(btn.dataset.sleep){
   battle.applyInspirit({id:btn.dataset.sleep,sign:'negative',effect:'sleep'});
   el('status').textContent='睡眠（実験用）を付与';draw();
 }else if(btn.dataset.purify){
   const result=battle.purify(Number(btn.dataset.owner),btn.dataset.purify);
   el('status').textContent=result.ok?'おはらい完了':'おはらい不可: '+result.reason;draw();
 }else if(btn.dataset.rotate!==undefined){battle.rotate(Number(btn.dataset.rotate),Number(btn.dataset.dir));el('status').textContent='回転しました';draw();}
 else if(btn.dataset.pin){const side=Number(btn.dataset.side),before=battle.snapshot();battle.pin(side,before.pins[side]===btn.dataset.pin?null:btn.dataset.pin);el('status').textContent='対象を更新';draw();}
 else if(btn.id==='one')next(1);
 else if(btn.id==='many')next(20);
 else if(btn.id==='reset'){battle=createCombat();actions=[];last=null;el('status').textContent='初期化';draw();}
 }catch(error){el('status').textContent=error.message;}
});
draw();
</script></body></html>
