<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phase 15 — オリジナル妖怪 6体デザインレビュー</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#26354d,#0d1625 70%);color:#f5f3ec;
font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans CJK JP",sans-serif}
main{max-width:1040px;margin:auto;padding:28px 24px 35px}
header{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:22px}
h1{font-size:27px;letter-spacing:1px;margin:4px 0}
p{margin:0;color:#b8c9d7;font-size:12px}small{font-size:10px;color:#e4c794;letter-spacing:2px}
.tag{font-weight:700;color:#ddbd89;border:1px solid #766a58;border-radius:30px;padding:8px 14px;font-size:10px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
.item{border-radius:19px;border:1px solid #435c71;background:linear-gradient(165deg,#2a4057,#1a2c42);overflow:hidden;min-height:256px;position:relative}
.item:nth-child(2),.item:nth-child(5){background:linear-gradient(165deg,#32465b,#193445)}
.item:nth-child(3),.item:nth-child(6){background:linear-gradient(165deg,#3f4055,#222a3d)}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 15px 0}
.no{font-size:11px;color:#e7d3aa;font-weight:900;letter-spacing:1.5px}
.shape{font-size:10px;color:#9eafbd}
.portrait{height:158px;display:grid;place-items:center;position:relative}
.portrait:before{content:"";position:absolute;border-radius:50%;width:138px;height:138px;background:radial-gradient(circle,#fff4c021,#ffffff03 68%,transparent)}
.mb-character-art{height:133px;width:133px;position:relative;z-index:1;overflow:visible}
.labels{padding:0 16px 16px}
.labels h2{margin:0;font-size:19px}
.labels p{margin-top:3px;color:#bfcbda;font-size:11px}
.footer{margin-top:18px;color:#97afbe;font-size:11px;display:flex;justify-content:space-between;gap:10px}
@media(max-width:650px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}header{display:block}.tag{display:none}}
</style>
</head><body><main><header>
<div><small>PROJECT RINSEN / PHASE 15 — CHARACTER DESIGN</small>
<h1>6体のレンタル妖怪</h1>
<p>対戦画面用・オリジナルのベクターキャラクター。輪郭／顔／装飾で見分ける。</p></div>
<div class="tag">軽量SVG × 6体 × 両チーム共通</div>
</header>
<div class="grid" id="gallery"></div>
<div class="footer"><span>待機・攻撃・被弾・回復：CSSで軽くアニメーション</span><span>学校iPad向け研究デザイン／未公開</span></div>
</main>
<script type="module">
import {SPIRIT_DESIGNS,renderSpiritPortrait} from '../ui/character-art.mjs';
const body=document.getElementById('gallery');
body.innerHTML=SPIRIT_DESIGNS.map((d,i)=>'<article class="item"><div class="top">'+
 '<span class="no">No. '+String(i+1).padStart(2,'0')+'</span>'+
 '<span class="shape">ORIGINAL VECTOR</span></div><div class="portrait">'+
 renderSpiritPortrait(i)+'</div><div class="labels"><h2>'+d.name+
 '</h2><p>'+d.role+' / '+d.code+'</p></div></article>').join('');
document.documentElement.dataset.galleryReady='true';
</script></body></html>
